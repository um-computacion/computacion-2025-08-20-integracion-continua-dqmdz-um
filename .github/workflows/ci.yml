name: CI with Coverage and SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    # --- CAMBIO #1: Añadimos permisos para crear Pull Requests ---
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and generate coverage report
        run: |
          coverage run -m unittest discover
          coverage xml -o cobertura.xml
          coverage report -m > coverage_report.txt

      - name: Run Pylint and generate report
        run: |
          pylint --rcfile=.pylintrc main.py test.py > pylint_report.txt || true

      - name: Generate reports file
        run: |
          cat << 'EOF' > generate_reports.py
          import os

          # Function to read file content
          def read_file(filepath):
              if not os.path.exists(filepath):
                  return f"Error: Report file not found at {filepath}"
              with open(filepath, "r") as f:
                  return f.read()

          # Read reports
          coverage_report = read_file("coverage_report.txt")
          pylint_report = read_file("pylint_report.txt")

          # Create the content for REPORTS.md
          reports_content = f"""# Automated Reports

          ## Coverage Report
          ```text
          {coverage_report}
          ```

          ## Pylint Report
          ```text
          {pylint_report}
          ```
          """

          # Write to REPORTS.md
          with open("REPORTS.md", "w") as f:
              f.write(reports_content)
          EOF
          python generate_reports.py

      # --- NUEVO PASO: Limpiar archivos intermedios ---
      - name: Clean up temporary files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm cobertura.xml coverage_report.txt generate_reports.py pylint_report.txt

      # --- CAMBIO #2: Reemplazamos 'git push' por la creación de un Pull Request ---
      - name: Create Pull Request with reports
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: Update automated reports [skip ci]"
          title: "Automated Reports Update"
          body: |
            This PR was automatically generated by a GitHub Action.
            It contains the latest test coverage and Pylint reports.
            Please review and merge.
          branch: "update-reports"
          delete-branch: true

